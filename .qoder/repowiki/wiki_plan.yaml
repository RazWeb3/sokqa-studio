version: 1

scope:
  include:
    - "app/**"
    - "web/**"
    - "docs/**"
    - "scripts/**"
    - "tests/**"
    - "packs/**"
    - ".github/workflows/**"
    - "main.py"
    - "README.md"
    - "requirements.txt"
    - "Dockerfile"
  exclude:
    - ".venv/**"
    - ".venv312/**"
    - ".deps/**"
    - ".agents/**"
    - ".kombai/**"
    - ".pytest_cache/**"
    - ".pytest_tmp/**"
    - "tmp/**"
    - "generated/**"
    - "model_comparison_outputs/**"
    - "**/__pycache__/**"

repowiki:
  notes:
    - text: "Sokqa Studio は FastAPI バックエンドと、web/index.html 1枚のバニラJS フロントエンドで構成される単一構成の Web アプリ。SPA フレームワークは不使用。"
    - text: "教材制作フローは Plan(設計)→Generate(生成)→Quality Check/Fix(品質)→TTS Recording(録音)→Pack 共有(QR/Manifest) の4〜5段階で、app/routes 配下のRouterが各段階のAPIを提供する。"
    - text: "app/services は planner.py / prompts.py / document_generator.py / quiz_generator.py / pack_agent.py などの生成系、quality_checker.py / quality_fixer.py / quality/ の品質系、tts_*.py の録音系、pack_*.py / storage_client.py / revision_*.py の保存・同期系に大きく分かれる。"
    - text: "pack_importer.py は Sokqa アプリへのインポート時にスキーマ type フィールドを厳密検証し、不正な manifest や reading-whitelist.json 等を拒否する。この検証ロジックは推測せず実装を確認して記述すること。"
    - text: "R2(Cloudflare)が学習パックの正典ストレージ、ローカルの packs/ はドラフト源であり、同期は pull 一方向＋JSONスナップショットのみ。双方向同期は採用していない。"
    - text: "README 上のプロジェクト名は Sokqa Studio だが、Cloud Run サービス名は sokqa-course-pack-agent（リージョン asia-northeast1）。ただし本番リリースまではローカル運用のみの方針により、Cloud Run サービスは削除済みで、deploy-cloud-run.yml も push トリガーを無効化し workflow_dispatch 手動実行のみ。Wiki ではこれを現状として記述し、自動デプロイ有効時の設計と混同しないこと。"
    - text: "TTS は Google Cloud Text-to-Speech を使用し、tts_rules.json とユーザー側ルールファイルのレイヤーで読み補正規則を管理する（システムルール＞ユーザールールの優先順）。"
    - text: "docs/ 配下（SPEC.md / AGENT_DESIGN.md / PROJECT_OVERVIEW.md / QUALITY_OPS_IMPLEMENTATION_PLAN.md など）が仕様・設計の一次情報源。コードと食い違う場合はコードの実装が優先されるべき旨を注記すること。"
  documents:
    - title: "プロジェクト概要と制作ワークフロー"
      goal: "Sokqa Studio が解決する課題、教材制作の4ステップ（生成・共有・品質チェック・録音）、関連プロダクト Sokqa アプリとの関係を整理する。"
      parent: ""
    - title: "バックエンド API 構成（FastAPI ルーター）"
      goal: "main.py と app/routes 配下の health/plan/generate/jobs/packs/tts_recording/quality_agents/debug 各ルーターの責務とエンドポイント一覧を説明する。"
      parent: ""
    - title: "生成パイプライン: Planner・Prompt・Generator"
      goal: "教材設計(app/services/planner.py)、プロンプト(app/services/prompts.py)、ドキュメント/クイズ生成(document_generator.py, quiz_generator.py)、generation strategies の関係を解説する。"
      parent: ""
    - title: "品質チェック・自動修正サブシステム"
      goal: "quality_checker.py / quality_fixer.py / quality/ dispatcher と、言語学習向け戦略(generation/language_learning/quality.py)の役割分担を説明する。"
      parent: ""
    - title: "TTS 録音・読み補正パイプライン"
      goal: "tts_rules.py / tts_optimizer.py / tts_recorder.py / tts_recording_api.py / tts_estimation.py の流れと、システムルール＞ユーザールールの優先順位・モード切替を説明する。"
      parent: ""
    - title: "パック保存・リビジョン管理・R2同期運用"
      goal: "pack_importer.py / pack_listing.py / revision_store.py / revision_commit.py / storage_client.py / packops.py の関係と、R2正典・ローカルドラフトの単方向同期戦略を説明する。"
      parent: ""
    - title: "データスキーマ定義（PackV2 / Sokqa / Quality / Request）"
      goal: "app/schemas 配下の Pydantic モデル群が表現する pack/quiz/manifest/quality/request の構造と検証ルールを整理する。"
      parent: ""
    - title: "フロントエンド（web/index.html）"
      goal: "単一HTMLで実現されている生成・品質・録音・共有UIの画面構成と、バックエンドAPIとの接続方法を説明する。"
      parent: ""
    - title: "デプロイ・CI（Cloud Run / GitHub Actions）とテスト戦略"
      goal: "Dockerfile、.github/workflows/deploy-cloud-run.yml による Cloud Run デプロイ、および tests/ 配下の pytest によるテスト種類を説明する。"
      parent: ""

knowledgecard:
  notes:
    - text: "app/services は生成・品質・TTS・保存/同期の4領域にモジュール境界が分かれている。カード作成時はこの領域単位でまとめても、個別モジュール単位でもよいが、領域横断の依存（例: 品質FixがTTSルールを参照する等）は明示すること。"
    - text: "pack_importer.py の type フィールド検証は厳密であり、不正な manifest/reading-whitelist を拒否する挙動が仕様上の重要ポイント。この検証ロジックを推測で記述したカードは不正確なので実装確認を優先。"
    - text: "R2同期は pull 一方向＋JSONスナップショット戦略に限定されている（双方向同期は却下済み）。これを前提としないカード記述は現運用と矛盾する。"
    - text: "packs/ はドラフト源、R2 が正典、packops CLI(scripts/packops.py, app/services/packops.py) が運用ツールである、という3層関係を各カードで共有前提として明記すること。"
