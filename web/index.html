<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sokqa Course Pack Agent</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f7f9;
        --panel: #ffffff;
        --line: #d8dee8;
        --text: #18202f;
        --muted: #5f6c80;
        --accent: #0f766e;
        --accent-dark: #115e59;
        --danger: #b42318;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.5;
      }

      header {
        border-bottom: 1px solid var(--line);
        background: var(--panel);
      }

      .wrap {
        width: min(1180px, calc(100% - 32px));
        margin: 0 auto;
      }

      header .wrap {
        padding: 20px 0 18px;
      }

      h1 {
        margin: 0;
        font-size: 1.45rem;
      }

      .subtitle {
        margin: 6px 0 0;
        color: var(--muted);
      }

      main {
        padding: 24px 0 48px;
      }

      .grid {
        display: grid;
        grid-template-columns: minmax(300px, 420px) minmax(0, 1fr);
        gap: 18px;
        align-items: start;
      }

      section {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 18px;
      }

      h2 {
        margin: 0 0 14px;
        font-size: 1.05rem;
      }

      label {
        display: block;
        margin: 12px 0;
        font-weight: 650;
      }

      input,
      select,
      textarea {
        width: 100%;
        margin-top: 6px;
        border: 1px solid #c5cfdd;
        border-radius: 6px;
        padding: 10px 11px;
        font: inherit;
        background: white;
        color: var(--text);
      }

      textarea {
        min-height: 260px;
        resize: vertical;
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
        font-size: 0.86rem;
      }

      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .field-label {
        display: block;
        margin: 12px 0;
        font-weight: 650;
      }

      .radio-group {
        display: grid;
        gap: 8px;
        margin-top: 6px;
      }

      .radio-option {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        margin: 0;
        font-weight: 500;
      }

      .radio-option input {
        width: auto;
        margin-top: 4px;
      }

      .radio-option small {
        display: block;
        color: var(--muted);
        font-weight: 400;
      }

      .actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 14px;
      }

      button,
      a.button {
        border: 0;
        border-radius: 6px;
        background: var(--accent);
        color: white;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
        min-height: 42px;
        padding: 0 14px;
        display: inline-flex;
        align-items: center;
        text-decoration: none;
      }

      button.secondary,
      a.button.secondary {
        background: #334155;
      }

      button:disabled {
        opacity: 0.55;
        cursor: wait;
      }

      .status {
        min-height: 28px;
        margin: 12px 0 0;
        color: var(--muted);
      }

      .error {
        color: var(--danger);
      }

      .output {
        display: grid;
        gap: 18px;
      }

      .manifest-link {
        overflow-wrap: anywhere;
      }

      .share-url {
        overflow-wrap: anywhere;
      }

      #qrcode {
        margin-top: 12px;
      }

      .logs {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 0;
        margin: 0;
        list-style: none;
      }

      .logs li {
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 5px 10px;
        color: var(--muted);
        background: #f8fafc;
        font-size: 0.9rem;
      }

      .recording-toolbar,
      .recording-summary,
      .credit-bar {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
        align-items: end;
      }

      .credit-bar {
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px;
        background: #f8fafc;
      }

      .credit-value {
        font-size: 1.3rem;
        font-weight: 800;
      }

      .pack-list,
      .unit-list {
        display: grid;
        gap: 8px;
        margin-top: 12px;
      }

      .pack-row,
      .unit-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 12px;
        align-items: center;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px 12px;
        background: #ffffff;
      }

      .pack-row.active {
        border-color: var(--accent);
        box-shadow: 0 0 0 1px rgba(15, 118, 110, 0.18);
      }

      .unit-row {
        grid-template-columns: auto minmax(0, 1fr) auto;
      }

      .unit-row input {
        width: auto;
        margin: 0;
      }

      .meta {
        color: var(--muted);
        font-size: 0.88rem;
      }

      .excerpt {
        margin-top: 4px;
        color: var(--text);
        overflow-wrap: anywhere;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        min-height: 26px;
        border-radius: 999px;
        padding: 0 9px;
        background: #e8f3f1;
        color: var(--accent-dark);
        font-size: 0.82rem;
        font-weight: 700;
        white-space: nowrap;
      }

      .badge.muted {
        background: #eef2f7;
        color: var(--muted);
      }

      .recording-result {
        margin-top: 12px;
        overflow-wrap: anywhere;
      }

      @media (max-width: 860px) {
        .grid,
        .row,
        .recording-toolbar,
        .recording-summary,
        .credit-bar {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="wrap">
        <h1>Sokqa Course Pack Agent</h1>
        <p class="subtitle">構成案を確認してから、Sokqa用JSON群とmanifestを生成します。</p>
      </div>
    </header>

    <main class="wrap grid">
      <section>
        <h2>入力</h2>
        <label>
          テーマ
          <input id="theme" value="ITパスポート試験対策" maxlength="160" />
        </label>
        <label>
          対象者
          <input id="targetUser" value="IT初心者の社会人" maxlength="160" />
        </label>
        <div class="row">
          <div class="field-label">
            規模
            <div class="radio-group" role="radiogroup" aria-label="規模">
              <label class="radio-option">
                <input type="radio" name="scale" value="quick" checked />
                <span>クイック <small>3〜5章</small></span>
              </label>
              <label class="radio-option">
                <input type="radio" name="scale" value="standard" />
                <span>スタンダード <small>6〜10章</small></span>
              </label>
              <label class="radio-option">
                <input type="radio" name="scale" value="auto" />
                <span>おまかせ <small>範囲制約なし</small></span>
              </label>
            </div>
          </div>
          <label>
            難易度
            <select id="difficulty">
              <option value="beginner">beginner</option>
              <option value="standard">standard</option>
              <option value="advanced">advanced</option>
            </select>
          </label>
        </div>
        <div class="row">
          <label>
            言語
            <input id="language" value="ja" maxlength="20" />
          </label>
          <label>
            TTS補正
            <select id="includeTts">
              <option value="true">ON</option>
              <option value="false">OFF</option>
            </select>
          </label>
        </div>
        <label>
          TTS読みモード
          <select id="ttsReadingMode">
            <option value="rule">rule</option>
            <option value="llm">llm</option>
            <option value="auto">auto</option>
          </select>
        </label>
        <label>
          参考資料テキスト
          <textarea id="sourceText" spellcheck="false" placeholder="貼り付けた資料からコンテンツを生成します（任意）"></textarea>
        </label>
        <label>
          資料の使い方
          <select id="sourceMode" disabled>
            <option value="document_reference">資料を参考に</option>
            <option value="document_only">資料のみ</option>
          </select>
        </label>
        <div class="actions">
          <button id="planBtn">構成案を作成</button>
          <button id="generateBtn" class="secondary" disabled>生成する</button>
        </div>
        <p id="status" class="status"></p>
      </section>

      <div class="output">
        <section>
          <h2>構成案</h2>
          <textarea id="planJson" spellcheck="false" placeholder="構成案がここに表示されます。編集してから生成できます。"></textarea>
        </section>

        <section>
          <h2>生成結果</h2>
          <div id="result"></div>
        </section>

        <section>
          <h2>録音管理</h2>
          <div class="credit-bar">
            <div>
              <div class="meta">疑似クレジット残高</div>
              <div class="credit-value"><span id="creditBalance">0.0000</span> credits</div>
            </div>
            <button id="resetCreditsBtn" type="button" class="secondary">残高リセット</button>
          </div>
          <div class="recording-toolbar">
            <label>
              creatorId
              <input id="packCreatorId" value="creator_default" maxlength="120" />
            </label>
            <label>
              録音テキスト
              <select id="recordingTextSource">
                <option value="raw">生テキスト</option>
                <option value="corrected">補正版優先</option>
              </select>
            </label>
            <div class="actions">
              <button id="loadPacksBtn" type="button">一覧更新</button>
            </div>
          </div>
          <p id="recordingStatus" class="status"></p>
          <div id="packList" class="pack-list"></div>

          <div id="recordingPanel" hidden>
            <div class="actions">
              <button id="selectUnrecordedBtn" type="button" class="secondary">未録音を全選択</button>
              <button id="clearUnitSelectionBtn" type="button" class="secondary">選択解除</button>
            </div>
            <div class="recording-summary">
              <p><strong>選択ユニット:</strong> <span id="selectedUnitCount">0</span></p>
              <p><strong>文字数:</strong> <span id="selectedChars">0</span></p>
              <p><strong>見積もり:</strong> <span id="selectedCredits">0.0000</span> credits</p>
            </div>
            <p id="creditWarning" class="status"></p>
            <div class="actions">
              <button id="recordSelectedBtn" type="button" disabled>録音化</button>
            </div>
            <div id="unitList" class="unit-list"></div>
            <div id="recordingResult" class="recording-result"></div>
          </div>
        </section>

        <section>
          <h2>TTS読み修正</h2>
          <label>
            追加ルール JSON
            <textarea id="ttsRules" spellcheck="false" style="min-height: 140px;">[
  { "source": "日本橋", "reading": "にほんばし", "note": "地名として読む場合" }
]</textarea>
          </label>
          <div class="actions">
            <button id="reviseBtn" class="secondary" disabled>TTSだけ再最適化</button>
          </div>
        </section>
      </div>
    </main>

    <script>
      const $ = (id) => document.getElementById(id);
      const statusEl = $("status");
      const planBtn = $("planBtn");
      const generateBtn = $("generateBtn");
      const planJson = $("planJson");
      const result = $("result");
      let currentJobId = "";
      const CREDIT_STORAGE_KEY = "sokqaRecordingCreditBalance";
      const INITIAL_CREDITS = 1;
      let creditBalance = Number(localStorage.getItem(CREDIT_STORAGE_KEY) || INITIAL_CREDITS);
      let selectedPack = null;
      let currentPacks = [];
      let fullEstimate = null;
      let selectedEstimate = null;
      let selectedUnitIds = new Set();
      let estimateTimer = null;
      let isRecordingBusy = false;

      function escapeHtml(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function formatCredits(value) {
        return Number(value || 0).toFixed(4);
      }

      function radioValue(name) {
        return document.querySelector(`input[name="${name}"]:checked`)?.value || "";
      }

      function isTtsEnabled() {
        return $("includeTts").value === "true";
      }

      function sourcePayload() {
        const sourceText = $("sourceText").value.trim();
        if (!sourceText) return {};
        return {
          sourceText,
          sourceMode: $("sourceMode").value
        };
      }

      function ttsPayload() {
        if (!isTtsEnabled()) return {};
        return {
          ttsReadingMode: $("ttsReadingMode").value
        };
      }

      function syncInputState() {
        $("sourceMode").disabled = !$("sourceText").value.trim();
        $("ttsReadingMode").disabled = !isTtsEnabled();
      }

      function setBusy(isBusy, message = "") {
        planBtn.disabled = isBusy;
        generateBtn.disabled = isBusy || !planJson.value.trim();
        statusEl.textContent = message;
        statusEl.classList.remove("error");
      }

      function setError(message) {
        statusEl.textContent = message;
        statusEl.classList.add("error");
        planBtn.disabled = false;
        generateBtn.disabled = !planJson.value.trim();
      }

      async function requestJson(url, payload) {
        const response = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.detail ? JSON.stringify(data.detail) : response.statusText);
        }
        return data;
      }

      async function requestGet(url) {
        const response = await fetch(url);
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.detail ? JSON.stringify(data.detail) : response.statusText);
        }
        return data;
      }

      function recordingTarget(pack) {
        return {
          creatorId: pack.creatorId,
          contentId: pack.contentId,
          versionId: pack.versionId,
          packName: pack.packName,
          kind: pack.kind
        };
      }

      function setRecordingStatus(message, isError = false) {
        const el = $("recordingStatus");
        el.textContent = message;
        el.classList.toggle("error", isError);
      }

      function saveCredits(value) {
        creditBalance = Math.max(0, Number(value || 0));
        localStorage.setItem(CREDIT_STORAGE_KEY, String(creditBalance));
        $("creditBalance").textContent = formatCredits(creditBalance);
        updateRecordButton();
      }

      function renderPacks(packs) {
        const list = $("packList");
        if (!packs.length) {
          list.innerHTML = '<p class="meta">表示できるパックがありません。</p>';
          return;
        }
        list.innerHTML = packs
          .map((pack, index) => {
            const active = selectedPack && selectedPack.url === pack.url ? " active" : "";
            return `
              <div class="pack-row${active}">
                <div>
                  <strong>${escapeHtml(pack.title)}</strong>
                  <div class="meta">${escapeHtml(pack.kind)} / ${escapeHtml(pack.contentId)} / ${escapeHtml(pack.versionId)}</div>
                </div>
                <button type="button" class="secondary" data-pack-index="${index}">選択</button>
              </div>
            `;
          })
          .join("");
        list.querySelectorAll("[data-pack-index]").forEach((button) => {
          button.addEventListener("click", () => selectPack(packs[Number(button.dataset.packIndex)]));
        });
      }

      async function loadPacks() {
        try {
          setRecordingStatus("パック一覧を取得しています...");
          const creatorId = $("packCreatorId").value.trim();
          const query = creatorId ? `?creatorId=${encodeURIComponent(creatorId)}` : "";
          const data = await requestGet(`/packs${query}`);
          currentPacks = data.items || [];
          selectedPack = null;
          fullEstimate = null;
          selectedEstimate = null;
          selectedUnitIds = new Set();
          $("recordingPanel").hidden = true;
          $("recordingResult").innerHTML = "";
          renderPacks(currentPacks);
          setRecordingStatus(`${currentPacks.length}件のパックを表示しました。`);
        } catch (error) {
          setRecordingStatus(error.message, true);
        }
      }

      async function fetchEstimate(unitIds = null) {
        if (!selectedPack) return null;
        const payload = {
          target: recordingTarget(selectedPack),
          textSource: $("recordingTextSource").value
        };
        if (unitIds) {
          payload.unitIds = unitIds;
        }
        return requestJson("/tts/recording-estimate", payload);
      }

      async function selectPack(pack) {
        try {
          selectedPack = pack;
          selectedUnitIds = new Set();
          selectedEstimate = null;
          $("recordingPanel").hidden = false;
          $("recordingResult").innerHTML = "";
          setRecordingStatus("録音対象を読み込んでいます...");
          renderPacks(currentPacks);
          fullEstimate = await fetchEstimate();
          renderUnits();
          await updateSelectedEstimate();
          setRecordingStatus(`${pack.title} の録音対象を表示しました。`);
        } catch (error) {
          setRecordingStatus(error.message, true);
        } finally {
          await refreshPackRows();
        }
      }

      async function refreshPackRows() {
        const creatorId = $("packCreatorId").value.trim();
        const query = creatorId ? `?creatorId=${encodeURIComponent(creatorId)}` : "";
        const data = await requestGet(`/packs${query}`);
        currentPacks = data.items || [];
        renderPacks(currentPacks);
      }

      function renderUnits() {
        const units = fullEstimate?.units || [];
        const list = $("unitList");
        if (!units.length) {
          list.innerHTML = '<p class="meta">録音対象ユニットがありません。</p>';
          return;
        }
        list.innerHTML = units
          .map((unit) => {
            const checked = selectedUnitIds.has(unit.itemId) ? " checked" : "";
            const statusBadge = unit.isRecorded
              ? '<span class="badge muted">録音済み</span>'
              : '<span class="badge">未録音</span>';
            const note = unit.isRecorded ? "選択しても追加消費なし" : `${unit.charCount} chars`;
            return `
              <label class="unit-row">
                <input type="checkbox" value="${escapeHtml(unit.itemId)}"${checked} />
                <span>
                  <strong>${escapeHtml(unit.itemId)}</strong>
                  <span class="meta"> ${escapeHtml(unit.kind)} / ${escapeHtml(note)}</span>
                  <div class="excerpt">${escapeHtml(unit.text).slice(0, 160)}</div>
                </span>
                ${statusBadge}
              </label>
            `;
          })
          .join("");
        list.querySelectorAll('input[type="checkbox"]').forEach((input) => {
          input.addEventListener("change", () => {
            if (input.checked) {
              selectedUnitIds.add(input.value);
            } else {
              selectedUnitIds.delete(input.value);
            }
            scheduleSelectedEstimate();
          });
        });
      }

      function scheduleSelectedEstimate() {
        window.clearTimeout(estimateTimer);
        estimateTimer = window.setTimeout(updateSelectedEstimate, 250);
      }

      async function updateSelectedEstimate() {
        const unitIds = Array.from(selectedUnitIds);
        if (!unitIds.length) {
          selectedEstimate = null;
          $("selectedUnitCount").textContent = "0";
          $("selectedChars").textContent = "0";
          $("selectedCredits").textContent = formatCredits(0);
          updateRecordButton();
          return;
        }
        try {
          selectedEstimate = await fetchEstimate(unitIds);
          $("selectedUnitCount").textContent = String(unitIds.length);
          $("selectedChars").textContent = String(selectedEstimate.totalChars || 0);
          $("selectedCredits").textContent = formatCredits(selectedEstimate.estimatedCredits || 0);
          updateRecordButton();
        } catch (error) {
          setRecordingStatus(error.message, true);
        }
      }

      function updateRecordButton() {
        const credits = selectedEstimate?.estimatedCredits || 0;
        const selectedCount = selectedUnitIds.size;
        const insufficient = credits > creditBalance;
        $("recordSelectedBtn").disabled = isRecordingBusy || selectedCount === 0 || insufficient;
        $("creditWarning").textContent = insufficient
          ? "クレジットが不足しています。来月のチャージ後に録音できます。"
          : selectedCount
            ? "録音済みユニットは追加消費なしでスキップされます。"
            : "";
        $("creditWarning").classList.toggle("error", insufficient);
      }

      async function recordSelectedUnits() {
        if (!selectedPack || !selectedUnitIds.size) return;
        try {
          isRecordingBusy = true;
          updateRecordButton();
          setRecordingStatus("録音を実行しています...");
          const unitIds = Array.from(selectedUnitIds);
          const beforeEstimate = selectedEstimate;
          const data = await requestJson("/tts/record", {
            target: recordingTarget(selectedPack),
            unitIds,
            textSource: $("recordingTextSource").value
          });
          const successfulIds = new Set((data.audioUrls || []).map((item) => item.unitId));
          const recordedChars = (beforeEstimate?.units || [])
            .filter((unit) => successfulIds.has(unit.itemId))
            .reduce((total, unit) => total + unit.charCount, 0);
          const rate = beforeEstimate && beforeEstimate.totalChars
            ? (beforeEstimate.estimatedCredits || 0) / beforeEstimate.totalChars
            : 0;
          saveCredits(creditBalance - recordedChars * rate);
          renderRecordingResult(data);
          fullEstimate = await fetchEstimate();
          selectedUnitIds = new Set();
          selectedEstimate = null;
          renderUnits();
          await updateSelectedEstimate();
          setRecordingStatus("録音処理が完了しました。");
        } catch (error) {
          setRecordingStatus(error.message, true);
        } finally {
          isRecordingBusy = false;
          updateRecordButton();
        }
      }

      function renderRecordingResult(data) {
        const summary = data.summary || {};
        $("recordingResult").innerHTML = `
          <p><strong>結果:</strong> success=${summary.successCount || 0}, failure=${summary.failureCount || 0}, skipped=${summary.skippedUnits || 0}</p>
          ${
            (summary.failedUnitIds || []).length
              ? `<p class="error"><strong>失敗:</strong> ${escapeHtml(summary.failedUnitIds.join(", "))}</p>`
              : ""
          }
          <ul class="logs">
            ${(data.audioUrls || [])
              .map((item) => `<li>${escapeHtml(item.unitId)}: <a href="${escapeHtml(item.audioUrl)}" target="_blank" rel="noreferrer">mp3</a></li>`)
              .join("")}
          </ul>
        `;
      }

      planBtn.addEventListener("click", async () => {
        try {
          result.innerHTML = "";
          setBusy(true, "Planning...");
          const plan = await requestJson("/plan-pack", {
            theme: $("theme").value,
            targetUser: $("targetUser").value,
            difficulty: $("difficulty").value,
            scale: radioValue("scale"),
            language: $("language").value,
            includeTts: isTtsEnabled(),
            enableTtsOptimize: isTtsEnabled(),
            ...ttsPayload(),
            ...sourcePayload()
          });
          planJson.value = JSON.stringify(plan, null, 2);
          setBusy(false, "構成案を作成しました。必要なら編集してから生成してください。");
        } catch (error) {
          setError(error.message);
        }
      });

      generateBtn.addEventListener("click", async () => {
        try {
          setBusy(true, "Generating...");
          const plan = JSON.parse(planJson.value);
          const generated = await requestJson("/generate-pack", {
            plan,
            outputMode: "manifest",
            persist: true,
            ...ttsPayload(),
            ...sourcePayload()
          });
          const manifestUrl = generated.files.find((file) => file.kind === "manifest")?.url;
          const shareUrl = manifestUrl ? `https://convly.jp/import?url=${encodeURIComponent(manifestUrl)}` : "";
          result.innerHTML = `
            <p><strong>Status:</strong> ${generated.status}</p>
            <p><strong>Validation:</strong> ${generated.validation.valid ? "valid" : "invalid"}</p>
            <p><strong>Files:</strong> ${generated.files.length}</p>
            <p class="manifest-link"><strong>Manifest:</strong> ${
              manifestUrl ? `<a href="${manifestUrl}" target="_blank" rel="noreferrer">${manifestUrl}</a>` : "not persisted"
            }</p>
            ${
              shareUrl
                ? `<p class="share-url"><strong>Sokqa取り込み用URL:</strong> ${shareUrl}</p>
                   <div class="actions">
                     <button id="copyShareUrlBtn" type="button" class="secondary">URLをコピー</button>
                   </div>
                   <div id="qrcode"></div>`
                : ""
            }
            <div class="actions">
              <a class="button" href="/jobs/${generated.jobId}/manifest" target="_blank" rel="noreferrer">manifestを見る</a>
              <a class="button secondary" href="/jobs/${generated.jobId}" target="_blank" rel="noreferrer">job JSONを見る</a>
            </div>
            <h3>Logs</h3>
            <ul class="logs">${generated.logs.map((log) => `<li>${log}</li>`).join("")}</ul>
          `;
          if (shareUrl) {
            const qrCodeTarget = $("qrcode");
            if (qrCodeTarget && window.QRCode) {
              new QRCode(qrCodeTarget, { text: shareUrl, width: 180, height: 180 });
            }
            $("copyShareUrlBtn")?.addEventListener("click", async (event) => {
              const button = event.currentTarget;
              await navigator.clipboard.writeText(shareUrl);
              const originalText = button.textContent;
              button.textContent = "コピーしました";
              setTimeout(() => {
                button.textContent = originalText;
              }, 1600);
            });
          }
          currentJobId = generated.jobId;
          $("reviseBtn").disabled = false;
          setBusy(false, "生成が完了しました。");
          loadPacks();
        } catch (error) {
          setError(error.message);
        }
      });

      $("reviseBtn").addEventListener("click", async () => {
        if (!currentJobId) return;
        try {
          setBusy(true, "Revising TTS...");
          const revised = await requestJson("/debug/revise-tts", {
            jobId: currentJobId,
            ttsRules: JSON.parse($("ttsRules").value),
            persist: true
          });
          result.insertAdjacentHTML("beforeend", `
            <p><strong>Revised version:</strong> ${revised.manifest.version}</p>
            <p><strong>Revision validation:</strong> ${revised.validation.valid ? "valid" : "invalid"}</p>
          `);
          setBusy(false, "TTSだけ再最適化しました。");
          $("reviseBtn").disabled = false;
        } catch (error) {
          setError(error.message);
        }
      });

      planJson.addEventListener("input", () => {
        generateBtn.disabled = !planJson.value.trim();
      });

      $("sourceText").addEventListener("input", syncInputState);
      $("includeTts").addEventListener("change", syncInputState);
      $("loadPacksBtn").addEventListener("click", loadPacks);
      $("resetCreditsBtn").addEventListener("click", () => saveCredits(INITIAL_CREDITS));
      $("selectUnrecordedBtn").addEventListener("click", () => {
        selectedUnitIds = new Set((fullEstimate?.units || []).filter((unit) => !unit.isRecorded).map((unit) => unit.itemId));
        renderUnits();
        scheduleSelectedEstimate();
      });
      $("clearUnitSelectionBtn").addEventListener("click", () => {
        selectedUnitIds = new Set();
        renderUnits();
        scheduleSelectedEstimate();
      });
      $("recordSelectedBtn").addEventListener("click", recordSelectedUnits);
      $("recordingTextSource").addEventListener("change", async () => {
        if (selectedPack) {
          await selectPack(selectedPack);
        }
      });
      syncInputState();
      saveCredits(creditBalance);
      loadPacks();
    </script>
  </body>
</html>
